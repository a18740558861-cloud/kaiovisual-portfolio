<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>凯奥视觉设计 | 个人作品集</title>
  <link rel="preconnect" href="https://a18740558861-cloud.github.io" crossorigin>
  <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
  <link rel="dns-prefetch" href="https://a18740558861-cloud.github.io">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <nav id="navbar" class="navbar">
    <div class="grid nav-inner">
      <a class="nav-logo" href="#" aria-label="凯奥视觉设计">
        <img id="nav-logo-img" src="" alt="凯奥视觉设计">
      </a>
      <ul class="nav-links" id="nav-links"></ul>
    </div>
  </nav>

  <header class="banner" id="banner">
    <div class="banner-track" id="banner-track"></div>
    <div class="banner-dim"></div>
    <button class="banner-arrow prev" id="banner-prev" type="button" aria-label="上一张">‹</button>
    <button class="banner-arrow next" id="banner-next" type="button" aria-label="下一张">›</button>
    <div class="banner-text">
      <p id="banner-en" class="banner-en"></p>
      <h1 id="banner-title" class="banner-title"></h1>
      <p id="banner-intro" class="banner-intro"></p>
    </div>
    <div class="banner-progress" id="banner-progress"></div>
  </header>

  <section class="marquee-bar" aria-label="服务过的品牌">
    <div class="marquee-track" id="marquee-track"></div>
  </section>

  <main>
    <section class="section" id="brand-space">
      <div class="container">
        <div class="section-head reveal">
          <h2 class="section-title">品牌空间</h2>
          <div class="tabs" id="space-tabs"></div>
        </div>
        <div class="grid gallery-grid" id="space-grid"></div>
        <div class="section-foot reveal">
          <button class="btn-outline" id="space-more" type="button">查看更多</button>
        </div>
      </div>
    </section>

    <section class="section" id="brand-plane">
      <div class="container">
        <div class="section-head reveal">
          <h2 class="section-title">品牌平面</h2>
          <div class="tabs" id="plane-tabs"></div>
        </div>
        <div class="grid gallery-grid" id="plane-grid"></div>
        <div class="section-foot reveal">
          <button class="btn-outline" id="plane-more" type="button">查看更多</button>
        </div>
      </div>
    </section>

    <section class="section section-dark" id="about">
      <div class="container grid grid-12">
        <div class="col-5 reveal">
          <h2 class="section-title">关于</h2>
          <p class="body-text">
            6年品牌设计相关经验。擅长品牌营销活动、展陈展示、SI系统标准化、从方案前期需求拆解，创意方案、到落地跟进全流程均可独立完成，确保项目能高效落地。个人优势是能在空间设计和平面设计工作中都能胜任。
          </p>
        </div>
        <div class="col-5 col-start-8 reveal">
          <h2 class="section-title">联系</h2>
          <p class="body-text">
            如果您有品牌升级、空间展陈、活动视觉或包装设计需求，欢迎随时交流。
          </p>
          <ul class="contact-list">
            <li>
              <span class="contact-label">电话</span>
              <a class="contact-link" href="tel:18220002240">18220002240</a>
              <span class="contact-note">（微信同号）</span>
            </li>
            <li>
              <span class="contact-label">邮箱</span>
              <a class="contact-link" href="mailto:2388271482@qq.com">2388271482@qq.com</a>
            </li>
          </ul>
          <div class="contact-qr">
            <img src="assets/images/6、联系素材/微信二维码.webp" alt="微信二维码" loading="lazy">
            <span class="contact-qr-cap">微信扫码，随时交流</span>
          </div>
        </div>
      </div>
    </section>
  </main>

  <footer class="footer">
    <div class="container">
      <p>© 2026 凯奥视觉设计 · 保留所有权利</p>
    </div>
  </footer>

  <script src="data.js"></script>
  <script src="main.js"></script>
</body>
</html>
